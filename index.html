
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DartVision</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- OpenCV -->
    <script async
            src="https://docs.opencv.org/4.x/opencv.js"></script>

    <!-- Main application -->
    <script type="module" src="js/main.js"></script>
</head>

<body>
    <h1>DartVision</h1>

    <!-- Camera controls -->
    <button id="start">Start Camera</button>
    <button id="detect" disabled>Detect Board</button>

    <p id="status">Camera not connected</p>

    <button id="calibrate" disabled>Kalibreer handmatig</button>
    <button id="cancel-calibration" hidden>Annuleren</button>
    <button id="toggle-overlay" hidden>Verberg uitlijning</button>

    <button id="track-pointer" disabled>Test dart herkennen</button>
    <button id="capture-reference" hidden>Leeg bord vastleggen</button>
    <button id="recognise-dart" hidden disabled>Herken dart</button>
    <section id="pointer-score" hidden aria-live="polite">
        <span class="score-caption">DARTPUNT · EXPERIMENTEEL</span>
        <strong id="score-value">—</strong>
        <span id="score-detail">Kalibreer eerst het bord.</span>
    </section>
    <div class="camera-stage" id="camera-stage">
        <video id="camera" autoplay playsinline muted></video>
        <canvas id="dart-frame" hidden></canvas>
        <canvas id="output" hidden></canvas>
        <canvas id="pointer-overlay" hidden></canvas>
        <p id="calibration-status">Markeer bij kalibratie vier punten op de buitenrand van de dubbelring.</p>
    </div>
</body>
</html>
