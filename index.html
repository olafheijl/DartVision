
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DartVision</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- OpenCV -->
    <script async
            src="https://docs.opencv.org/4.x/opencv.js"></script>

    <!-- Main application -->
    <script type="module" src="js/main.js"></script>
</head>

<body>
    <h1>DartVision</h1>

    <!-- Camera controls -->
    <button id="start">Start Camera</button>
    <button id="detect" disabled>Detect Board</button>

    <p id="status">Camera not connected</p>

    <!-- Live camera -->
    <video id="camera" autoplay playsinline muted></video>

    <!-- Detection result -->
    <canvas id="output"></canvas>

    <button id="calibrate" disabled>Kalibreer handmatig</button>
    <button id="cancel-calibration" hidden>Annuleren</button>
    <p id="calibration-status">Houd de camera vast op dezelfde plek. Markeer bij kalibratie vier punten op de buitenrand van de dubbelring.</p>
    <canvas id="calibration-preview" hidden></canvas>
</body>
</html>
