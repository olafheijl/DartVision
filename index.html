
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DartVision</title>

    <link rel="stylesheet" href="css/app.css">

    <!-- OpenCV -->
    <script async
            src="https://docs.opencv.org/4.x/opencv.js"></script>

    <!-- Main application -->
    <script type="module" src="js/app.js"></script>
</head>

<body>
    <h1>DartVision</h1>

    <!-- Camera controls -->
    <button id="start">Start Camera</button>
    <button id="detect" disabled>Detect Board</button>

    <p id="status">Camera not connected</p>

    <button id="calibrate" disabled>Kalibreer handmatig</button>
    <button id="cancel-calibration" hidden>Annuleren</button>
    <button id="toggle-overlay" hidden>Verberg uitlijning</button>

    <button id="test-dart" disabled>Test dart herkennen</button>
    <button id="capture-empty-board" hidden>Leeg bord vastleggen</button>
    <button id="capture-thrown-dart" hidden disabled>Ik heb een pijl gegooid</button>
    <section id="dart-test-panel" hidden>
        <p id="dart-test-status" role="status">Kalibreer eerst het bord.</p>
        <div class="captured-frames">
            <figure><figcaption>Leeg bord</figcaption><canvas id="empty-board-frame" hidden></canvas></figure>
            <figure><figcaption>Na de worp</figcaption><canvas id="thrown-dart-frame" hidden></canvas></figure>
            <figure><figcaption>Verschil tussen bord</figcaption><canvas id="difference-canvas" hidden></canvas></figure>
        </div>
    </section>
    <div class="camera-viewport">
        <div class="camera-stage" id="camera-stage">
            <video id="camera" autoplay playsinline muted></video>
            <canvas id="output" hidden></canvas>
            <p id="calibration-status">Markeer bij kalibratie vier punten op de buitenrand van de dubbelring.</p>
        </div>
    </div>
</body>
</html>
