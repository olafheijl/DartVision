<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Beeldproeven</title>
    <style>
        body {
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .images {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        figure { margin: 0; }

        canvas {
            max-width: 350px;
            max-height: 500px;
            object-fit: contain;
        }
    </style>

    <script async
        src="https://docs.opencv.org/4.x/opencv.js">
    </script>
</head>
<body>
    <label for="comparison">Vergelijking:</label>
    <select id="comparison">
        <option value="0-1">Leeg bord → eerste dart</option>
        <option value="1-2">Eerste dart → tweede dart</option>
        <option value="0-2">Leeg bord → beide darts (één flight markeren)</option>
    </select>
    <button id="run">Test uitvoeren</button>
    <p id="status" role="status"></p>
    <p>Rood: mogelijke flight · blauw: rechte randen · groen: geschatte schachtrichting · geel: verste pixel binnen het geselecteerde dartmasker. Controleer de uitlijning; er wordt geen score berekend.</p>

    <div class="images">
        <figure>
            <figcaption>Leeg bord</figcaption>
            <canvas id="empty-bord"></canvas>
        </figure>

        <figure>
            <figcaption>Met 1 dart</figcaption>
            <canvas id="bord-1"></canvas>
        </figure>
        
        <figure>
            <figcaption>Met 2 darts</figcaption>
            <canvas id="bord-2"></canvas>
        </figure>
        <figure>
            <figcaption>Resultaat</figcaption>
            <canvas id="result"></canvas>
        </figure>
        <figure>
            <figcaption>Mogelijke flight</figcaption>
            <canvas id="flight-mask"></canvas>
        </figure>
        <figure>
            <figcaption>Gevonden objecten · rood: mogelijke flight</figcaption>
            <canvas id="contour-result"></canvas>
        </figure>
        <figure>
            <figcaption>Rechte schachtranden en geschatte richting</figcaption>
            <canvas id="shaft-result"></canvas>
        </figure>
        <figure>
            <figcaption>Geselecteerd dartmasker · geel: uiterste maskerpixel</figcaption>
            <canvas id="dart-mask"></canvas>
        </figure>
        <figure>
            <figcaption>Geschatte punt langs de schacht</figcaption>
            <canvas id="tip-result"></canvas>
        </figure>
        <figure id="D3">
            <figcaption>D3</figcaption>
            <canvas></canvas>
        </figure>
        <figure id="D11">
            <figcaption>D11</figcaption>
            <canvas></canvas>
        </figure>
        <figure id="S4">
            <figcaption>S4</figcaption>
            <canvas></canvas>
        </figure>
        <figure id="T2">
            <figcaption>T2</figcaption>
            <canvas></canvas>
        </figure>
        <figure id="N0">
            <figcaption>N0</figcaption>
            <canvas></canvas>
        </figure>
    </div>

    <script type="module" src="/js/image-test.js"></script>
</body>
</html>
